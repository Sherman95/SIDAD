[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashboard-agent"
version = "0.1.0"
description = "Agente inteligente para automatización de dashboards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "jsonschema>=4.26.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0"
]
